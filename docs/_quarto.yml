project:
  type: website
  output-dir: html

website:
  title: "package_name"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: architecture/index.md
        text: Architecture
      - href: reference/hello.qmd
        text: Reference
    right:
      - icon: github
        href: "https://github.com/novica/r-project-template"
  sidebar:
    style: docked
    contents:
      - text: "Home"
        href: index.qmd
      - section: "Architecture"
        contents:
          - architecture/index.md
          - architecture/adr/index.md
      - section: "API Reference"
        contents:
          # Generated by quartify (see justfile's `docs-build`), one file per documented module
          # under src/package_name/*.r — this list isn't auto-discovered and needs a manual entry
          # when a module is added or removed. __init__.r is excluded (see docs-build): it's just
          # box::use() re-export wiring, not a documented module.
          - text: "hello"
            href: reference/hello.qmd

format:
  html:
    theme: cosmo
    toc: true
