name: Generate Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md" # feeds the site's home page
      - ".github/workflows/generate-docs.yml"
      - "src/package_name/**" # rebuild if API docs change

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6"

      - name: Set up quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install rv
        run: curl -sSL https://raw.githubusercontent.com/A2-ai/rv/refs/heads/main/scripts/install.sh | bash

      - name: Sync project
        run: rv sync

      - name: Install rd2qmd
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/eitsupi/rd2qmd/releases/latest/download/rd2qmd-installer.sh | sh

      - name: Generate API reference (box + rd2qmd)
        run: |
          Rscript scripts/gen-rd.R
          rm -rf docs/reference && mkdir -p docs/reference
          rd2qmd man/ -f md -o docs/reference/
          rm -rf man

      - name: Generate home page content
        run: |
          # Home page includes README minus its badges block (GitHub-only, not relevant on the docs site)
          sed '/<!-- badges: start -->/,/<!-- badges: end -->/d' README.md > docs/_readme.md

      - name: Render docs site (Quarto)
        run: quarto render docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./docs/html/"

  deploy:
    runs-on: ubuntu-latest
    needs: docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
