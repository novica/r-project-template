project:
  type: website
  output-dir: html

website:
  title: "package_name"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: architecture/index.md
        text: Architecture
      - href: reference/init.qmd
        text: Reference
    right:
      - icon: github
        href: "https://github.com/novica/r-project-template"
  sidebar:
    style: docked
    contents:
      - index.qmd
      - section: "Architecture"
        contents:
          - architecture/index.md
          - architecture/adr/index.md
      - section: "API Reference"
        contents:
          # Generated by quartify (see justfile's `docs-build`), one file per src/package_name/*.r
          # module — this list isn't auto-discovered and needs a manual entry when a module is
          # added or removed. Filenames have leading underscores stripped on relocation (e.g.
          # __init__.qmd -> init.qmd) since Quarto excludes underscore-prefixed files from the
          # project by default.
          - text: "Package overview"
            href: reference/init.qmd
          - text: "hello"
            href: reference/hello.qmd

format:
  html:
    theme: cosmo
    toc: true
