project:
  type: website
  output-dir: html

website:
  title: "package_name"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: architecture/index.md
        text: Architecture
      - href: reference/say_hello.md
        text: Reference
    right:
      - icon: github
        href: "https://github.com/novica/r-project-template"
  sidebar:
    style: docked
    contents:
      - text: "Home"
        href: index.qmd
      - section: "Architecture"
        contents:
          - architecture/index.md
          - architecture/adr/index.md
      - section: "API Reference"
        contents:
          # Generated by scripts/gen-rd.R + rd2qmd (see justfile's `docs-build`), one page per
          # documented topic (module doc + each exported function) under src/package_name/*.r —
          # this list isn't auto-discovered and needs a manual entry when a topic is added or
          # removed. __init__.r is excluded (see scripts/gen-rd.R): it's just box::use() re-export
          # wiring, not a documented module.
          - text: "say_hello"
            href: reference/say_hello.md
          - text: "say_goodbye"
            href: reference/say_goodbye.md
          - text: "hello (module overview)"
            href: reference/hello-module.md

format:
  html:
    theme: cosmo
    toc: true
