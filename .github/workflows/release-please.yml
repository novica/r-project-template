name: Release Please

on:
    push:
        branches:
            - main

concurrency:
    group: release-please
    cancel-in-progress: true

jobs:
    release-please:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write

        steps:
            - uses: googleapis/release-please-action@v5
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
