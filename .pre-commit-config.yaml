repos:
# --- R tooling: air (format), jarl (lint), ry (static check) ---
# Local `system` hooks run whatever binary is installed (latest via the installers
# in .devcontainer/Dockerfile and CI), keeping hooks, CI and editors on the same
# version. The upstream air/jarl hook repos need a pinned `rev` and install via
# Python, which prek otherwise avoids (see ADR-002 and ADR-007).
  - repo: local
    hooks:
      - id: air-format
        name: air format
        # Upstream binary is `air`; some distros (e.g. Arch) package it as `r-air`
        entry: bash -c 'if command -v air >/dev/null; then exec air format "$@"; else exec r-air format "$@"; fi' --
        language: system
        types_or: [r]
        require_serial: true
      - id: jarl-check
        name: jarl check
        entry: jarl check
        language: system
        files: \.(R|r|Rmd|rmd|qmd)$
        require_serial: true
      - id: ry-check
        name: ry check
        # Whole project: ry resolves bindings across files, so checking only staged files
        # would miss cross-file breakage
        entry: ry check .
        language: system
        types_or: [r]
        pass_filenames: false

# --- Basic hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: pretty-format-json
        args: ["--autofix", "--no-ensure-ascii"]
        files: "\\.(json)$"

  # --- Conventional commits ---
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0  # check for latest version
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # --- Spelling (code+docs) ---
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: ["--skip", "uv.lock,dist,build,.venv,*.min.js"]
        exclude: |
          (?x)(
            ^docs/_build/|
            ^.*/vendor/.*
          )
