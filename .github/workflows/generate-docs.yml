name: Generate Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md" # feeds the site's home page
      - ".github/workflows/generate-docs.yml"
      - "src/package_name/**" # rebuild if API docs change

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"

      - name: Set up quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install rv
        run: curl -sSL https://raw.githubusercontent.com/A2-ai/rv/refs/heads/main/scripts/install.sh | bash

      - name: Sync project
        run: rv sync

      - name: Generate API reference (Quartify)
        run: |
          Rscript -e "quartify::rtoqmd_dir('src/package_name/', create_book = FALSE, render_html = FALSE, exclude_pattern = '__tests__')"
          rm -rf docs/reference && mkdir -p docs/reference
          for f in src/package_name/*.qmd; do mv "$f" "docs/reference/$(basename "$f" | sed 's/^_*//')"; done

      - name: Render docs site (Quarto)
        run: quarto render docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./docs/html/"

  deploy:
    runs-on: ubuntu-latest
    needs: docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
