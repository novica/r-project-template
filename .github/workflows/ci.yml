name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.Rmd"
      - "docs/**"
      - "inst/**"
      - "*.md"
      - ".github/**"
      - "*.json "
      - "CITATION.cff"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.Rmd"
      - "docs/**"
      - "inst/**"
      - "*.md"
      - ".github/**"
      - "*.json "
      - "CITATION.cff"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install rig
        run: curl -fsSL https://github.com/r-lib/rig/releases/download/latest/rig-linux-x86_64-latest.tar.gz | sudo tar xz -C /usr/local

      - name: Check rproj.lock is up to date
        run: rig proj lock && git diff --exit-code rproj.lock

      - name: Install R and sync project
        run: rig proj sync --frozen

      - name: Install air
        run: curl -LsSf https://github.com/posit-dev/air/releases/latest/download/air-installer.sh | sh

      - name: Run air (check only)
        run: air format --check .

      - name: Setup jarl
        uses: etiennebacher/setup-jarl@v0.1.1

      - name: Run jarl lint
        run: jarl check .

      - name: Install ry
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/sims1253/ry/releases/latest/download/ry-cli-installer.sh | sh

      - name: Run ry check
        run: ry check --output-format github .

      - name: Run tests with testthat
        run: rig run scripts/run-tests.R
