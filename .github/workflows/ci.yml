name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.Rmd"
      - "docs/**"
      - "inst/**"
      - "*.md"
      - ".github/**"
      - "*.json "
      - "CITATION.cff"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.Rmd"
      - "docs/**"
      - "inst/**"
      - "*.md"
      - ".github/**"
      - "*.json "
      - "CITATION.cff"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uvr
        run: curl -fsSL https://raw.githubusercontent.com/nbafrank/uvr/main/install.sh | sh

      - name: Install R (via uvr)
        run: uvr r install $(cat .r-version)

      - name: Sync project
        run: uvr sync --frozen

      - name: Install air
        run: curl -LsSf https://github.com/posit-dev/air/releases/latest/download/air-installer.sh | sh

      - name: Run air (check only)
        run: air format --check .

      - name: Setup jarl
        uses: etiennebacher/setup-jarl@v0.1.1

      - name: Run jarl lint
        run: jarl check .

      - name: Run tests with testthat
        run: uvr run scripts/run-tests.R
